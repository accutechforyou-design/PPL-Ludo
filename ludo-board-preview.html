<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PPL Ludo — Pioneer LT 12</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#ececec;color:#222;font-family:'Exo 2',sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:#f4f4f4}

.topbar{background:#fff;border-bottom:2px solid #e0e0e0;padding:.6rem 1rem;
  display:flex;align-items:center;gap:.7rem;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,.08)}
.tlogo{width:42px;height:42px;border-radius:50%;border:2px solid #c9a84c;object-fit:contain;flex-shrink:0}
.tlogo-fb{width:42px;height:42px;border-radius:50%;border:2px solid #c9a84c;background:#f5f5f5;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:900;font-size:.75rem;color:#c9a84c;flex-shrink:0}
.tname{font-family:'Cinzel',serif;font-size:.9rem;font-weight:700;color:#1a1a2e;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tteam{font-family:'Rajdhani',sans-serif;font-size:.7rem;color:#888;letter-spacing:.3px}
.met-badge{flex-shrink:0;text-align:right}
.met-num{font-family:'Cinzel',serif;font-size:.95rem;font-weight:700;color:#27ae60}
.met-lbl{font-size:.55rem;font-family:'Rajdhani',sans-serif;font-weight:700;
  color:#999;letter-spacing:.8px;text-transform:uppercase}

.main{flex:1;overflow-y:auto;padding:.6rem;
  padding-bottom:calc(62px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:.55rem}

.prog-wrap{background:#fff;border:1px solid #e0e0e0;border-radius:12px;
  padding:.7rem .85rem;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.32rem}
.prog-title{font-family:'Cinzel',serif;font-size:.73rem;font-weight:700;
  color:#333;letter-spacing:.5px;text-transform:uppercase}
.prog-ct{font-size:.73rem;font-family:'Rajdhani',sans-serif;font-weight:600;color:#666}
.prog-bar{height:7px;background:#eee;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;
  background:linear-gradient(90deg,#27ae60,#f39c12,#e74c3c);transition:width .5s}
.prog-cats{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.3rem}
.pcat{display:flex;align-items:center;gap:.2rem;font-size:.62rem;
  font-family:'Rajdhani',sans-serif;font-weight:600;color:#666}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── LUDO BOARD ─────────────────────────────────────────── */
.board-wrap{display:flex;justify-content:center}
.board{
  width:100%;max-width:376px;
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  background:#ccc;
  border:3px solid #aaa;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  gap:1px;
}
.cell{
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;background:#fff;
  font-size:6px;line-height:1.1;
}
/* home zones */
.gh{background:#d5f5e3}
.rh{background:#fdecea}
.yh{background:#fef9e7}
.bh{background:#dbeafe}
/* inner white box within home */
.gh.inner,.rh.inner,.yh.inner,.bh.inner{background:#fff}
/* token circles */
.tok{width:68%;height:68%;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);
  box-shadow:inset 0 1.5px 4px rgba(0,0,0,.2);flex-shrink:0}
/* safe strips */
.sG{background:#a8e6bc}
.sR{background:#f9b8b4}
.sY{background:#fde68a}
.sB{background:#bdd7f8}
/* safe strip end (darker, touching center) */
.sGe{background:#27ae60}
.sRe{background:#e74c3c}
.sYe{background:#f39c12}
.sBe{background:#2980b9}
/* center */
.ctr{background:#f0f0f0}
/* star squares */
.star-sq{background:#fff9c4}
/* path squares */
.path{background:#fff}
/* member squares */
.mbr{cursor:pointer;background:#27ae60}
.mbr:active{filter:brightness(.85)}
.mbr.done{opacity:.38;cursor:default}
.mbr.done::after{content:'✓';position:absolute;font-size:1.8em;
  color:rgba(255,255,255,.9);font-weight:900;font-family:sans-serif;
  left:50%;top:50%;transform:translate(-50%,-50%)}
.mn{font-size:5.5px;font-weight:700;text-align:center;line-height:1.15;
  padding:1px;word-break:break-word;font-family:'Rajdhani',sans-serif;
  color:#fff;pointer-events:none;z-index:1;display:block;
  max-width:100%;overflow:hidden}

/* ── BOTTOM NAV ─────────────────────────────────────────── */
.bnav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;
  height:calc(58px + env(safe-area-inset-bottom,0px));
  background:#fff;border-top:1px solid #e0e0e0;
  display:flex;align-items:flex-start;padding-top:5px;z-index:100;
  box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.nit{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  cursor:pointer;color:#bbb;padding:2px 0}
.nit.on{color:#27ae60}
.nico{font-size:1.2rem}
.nlb{font-family:'Rajdhani',sans-serif;font-size:.54rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.4px}

/* ── FOOTER ─────────────────────────────────────────────── */
.footer{text-align:center;padding:.45rem .5rem;
  font-size:.58rem;color:#aaa;font-family:'Rajdhani',sans-serif;
  letter-spacing:.2px;line-height:1.5;border-top:1px solid #ddd;background:#fff}
.footer b{color:#888;font-weight:700}

/* ── MODAL ──────────────────────────────────────────────── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;
  display:none;align-items:flex-end}
.ov.open{display:flex}
.sheet{background:#fff;border-radius:22px 22px 0 0;border-top:4px solid #27ae60;
  padding:1.2rem;padding-bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));
  width:100%;max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .28s ease}
.ov.open .sheet{transform:translateY(0)}
.handle{width:36px;height:4px;background:#e0e0e0;border-radius:99px;margin:0 auto .9rem}
.mt{font-family:'Cinzel',serif;font-size:.95rem;font-weight:700;margin-bottom:.12rem;color:#1a1a2e}
.ms{font-size:.78rem;color:#888;margin-bottom:.9rem;font-family:'Exo 2',sans-serif}
.pa{border:2px dashed #d0d0d0;border-radius:12px;padding:1.4rem;text-align:center;
  cursor:pointer;margin-bottom:.8rem;transition:border-color .15s}
.pa.hp{border-style:solid;border-color:#27ae60}
.pa img{width:100%;max-height:160px;object-fit:cover;border-radius:8px}
.pi{font-size:2rem;margin-bottom:.3rem}
.pt{font-size:.78rem;color:#aaa}
.pr{background:#f8f8f8;border-radius:10px;padding:.8rem 1rem;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:.9rem;border:1px solid #eee}
.pl{font-size:.78rem;color:#888;font-family:'Rajdhani',sans-serif;font-weight:600}
.pv{font-family:'Cinzel',serif;font-size:1.2rem;font-weight:900;color:#27ae60}
.mbs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.bc{padding:.8rem;background:#f5f5f5;color:#666;border:1px solid #e0e0e0;
  border-radius:10px;font-size:.85rem;cursor:pointer;
  font-family:'Rajdhani',sans-serif;font-weight:600}
.bk{padding:.8rem;color:#fff;border:none;border-radius:10px;
  font-size:.85rem;font-weight:700;cursor:pointer;
  font-family:'Rajdhani',sans-serif;letter-spacing:.5px;text-transform:uppercase;
  transition:opacity .15s;background:#27ae60}
.bk:disabled{opacity:.3;cursor:not-allowed}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(8px);
  background:#333;border-radius:10px;padding:.55rem 1rem;font-size:.78rem;
  color:#fff;z-index:999;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

<div class="topbar">
  <img class="tlogo" src="icons/ppl-logo.png"
    onerror="this.style.display='none';document.getElementById('tfb').style.display='flex'">
  <div class="tlogo-fb" id="tfb" style="display:none">PPL</div>
  <div style="flex:1;min-width:0">
    <div class="tname" id="tname">Abhishek Shah</div>
    <div class="tteam" id="tteam">Director</div>
  </div>
  <div class="met-badge">
    <div class="met-num" id="met-num">0/15</div>
    <div class="met-lbl">Met</div>
  </div>
</div>

<div class="main">
  <div class="prog-wrap">
    <div class="prog-top">
      <span class="prog-title">My Progress</span>
      <span class="prog-ct" id="prog-ct">0 / 15 Met</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="prog-cats" id="prog-cats"></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="footer">
    🎲 <b>PPL Ludo — Pioneer LT 12</b> &nbsp;·&nbsp; June 12 – July 12, 2026<br>
    Created by <b>Abhishek Shah, Srishti Shah, Dr Vivek Mehta</b>
  </div>
</div>

<div class="bnav">
  <div class="nit on"><div class="nico">🎲</div><div class="nlb">Board</div></div>
  <div class="nit"><div class="nico">🏆</div><div class="nlb">Scores</div></div>
  <div class="nit"><div class="nico">📅</div><div class="nlb">Calendar</div></div>
  <div class="nit"><div class="nico">👤</div><div class="nlb">Profile</div></div>
</div>

<div class="ov" id="ov">
  <div class="sheet" id="sh">
    <div class="handle"></div>
    <div class="mt" id="mt">Log Meeting</div>
    <div class="ms" id="ms"></div>
    <div class="pa" id="pa" onclick="document.getElementById('fin').click()">
      <div class="pi">📸</div>
      <div class="pt">Tap to take selfie or upload photo</div>
    </div>
    <input type="file" id="fin" accept="image/*" style="display:none" onchange="handlePhoto(event)">
    <div class="pr">
      <div class="pl">Points you will earn</div>
      <div class="pv">+1,000</div>
    </div>
    <div class="mbs">
      <button class="bc" onclick="closeModal()">Cancel</button>
      <button class="bk" id="bok" disabled onclick="confirmMeet()">Confirm ✓</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

</div>

<script>
const USER = {name:"Abhishek Shah", team:"Director"};

// Demo board: 15 members across 4 colors
// Green=top, Red=right, Blue=bottom, Yellow=left
const ARMS = {
  G: {
    label:"Green", hex:"#27ae60", light:"#d5f5e3",
    members:[
      {name:"Timir Shah",       team:"Carpadium"},
      {name:"Anju Choradiya",   team:"Bodyline Healthcare"},
      {name:"Darshan Sanghavi", team:"Bodyline Healthcare"},
      {name:"Dhara Dalal",      team:"Legacy Link"},
    ]
  },
  R: {
    label:"Red", hex:"#e74c3c", light:"#fdecea",
    members:[
      {name:"Dimple Jhaveri",   team:"Carpadium"},
      {name:"Hardik Kapadia",   team:"Carpadium"},
      {name:"Aarjav Shah",      team:"Jainam Global"},
      {name:"Ketan Shah",       team:"Jainam Global"},
    ]
  },
  B: {
    label:"Blue", hex:"#2980b9", light:"#dbeafe",
    members:[
      {name:"Harshal Shah",     team:"LT"},
      {name:"Chirag Shah",      team:"Swarratna Dev."},
      {name:"Aakash Malu",      team:"Legacy Link"},
    ]
  },
  Y: {
    label:"Yellow", hex:"#d4ac0d", light:"#fef9e7",
    members:[
      {name:"Dhruv Shah",       team:"VE Ventures"},
      {name:"Alpesh Dholakia",  team:"Core Motion"},
      {name:"Mohit Lodha",      team:"Vanilla Ventures"},
      {name:"Ashesh Shah",      team:"VE Ventures"},
    ]
  }
};

const MET = new Set();
let SEL = null, PHOTO = null;

// ── GRID ──────────────────────────────────────────────────
// Cell type codes:
// GH/RH/YH/BH = home zones; GI/RI/YI/BI = inner white box; GT/RT/YT/BT = token circles
// SG/SR/SY/SB = safe strips; SGE/SRE/SYE/SBE = safe strip ends (darker)
// P = path; STAR = star/safe square
// CTR = center
// MG/MR/MB/MY = member squares

function buildGrid() {
  // 15×15 map of cell descriptors
  const grid = [];
  for(let r=0;r<15;r++){
    grid[r]=[];
    for(let c=0;c<15;c++){
      grid[r][c] = getBase(r,c);
    }
  }

  // Member squares (override path cells)
  // Green arm (top): col 6, rows 1-4 (path cells in top arm)
  ARMS.G.members.forEach((m,i)=>{ grid[i+1][6] = {type:'MG', m}; });
  // Red arm (right): row 6, cols 9-12
  ARMS.R.members.forEach((m,i)=>{ grid[6][9+i] = {type:'MR', m}; });
  // Blue arm (bottom): col 8, rows 9-11
  ARMS.B.members.forEach((m,i)=>{ grid[9+i][8] = {type:'MB', m}; });
  // Yellow arm (left): row 8, cols 0-3
  ARMS.Y.members.forEach((m,i)=>{ grid[8][i] = {type:'MY', m}; });

  return grid;
}

function getBase(r,c) {
  // Home zones (TL=Green, TR=Red, BL=Yellow, BR=Blue)
  if(r<=5 && c<=5){
    // inner white box rows 1-4, cols 1-4
    if(r>=1&&r<=4&&c>=1&&c<=4){
      // token circles at 2×2 center
      if((r===2||r===3)&&(c===2||c===3)) return {type:'GT'};
      return {type:'GI'};
    }
    return {type:'GH'};
  }
  if(r<=5 && c>=9){
    if(r>=1&&r<=4&&c>=10&&c<=13){
      if((r===2||r===3)&&(c===11||c===12)) return {type:'RT'};
      return {type:'RI'};
    }
    return {type:'RH'};
  }
  if(r>=9 && c<=5){
    if(r>=10&&r<=13&&c>=1&&c<=4){
      if((r===11||r===12)&&(c===2||c===3)) return {type:'YT'};
      return {type:'YI'};
    }
    return {type:'YH'};
  }
  if(r>=9 && c>=9){
    if(r>=10&&r<=13&&c>=10&&c<=13){
      if((r===11||r===12)&&(c===11||c===12)) return {type:'BT'};
      return {type:'BI'};
    }
    return {type:'BH'};
  }
  // Center 3×3
  if(r>=6&&r<=8&&c>=6&&c<=8) return {type:'CTR',cr:r-6,cc:c-6};
  // Safe strips
  if(c===7&&r>=1&&r<=4) return {type:'SG'};
  if(c===7&&r===5) return {type:'SGE'};
  if(r===7&&c>=1&&c<=4) return {type:'SY'};
  if(r===7&&c===5) return {type:'SYE'};
  if(r===7&&c>=10&&c<=13) return {type:'SR'};
  if(r===7&&c===9) return {type:'SRE'};
  if(c===7&&r>=10&&r<=13) return {type:'SB'};
  if(c===7&&r===9) return {type:'SBE'};
  // Star squares
  const stars=[[0,8],[2,6],[6,0],[6,14],[8,0],[8,14],[12,6],[12,8],[14,6],[6,2],[6,12],[8,2],[8,12]];
  if(stars.some(([sr,sc])=>sr===r&&sc===c)) return {type:'STAR'};
  return {type:'P'};
}

function renderBoard() {
  const bd = document.getElementById('board');
  const grid = buildGrid();
  bd.innerHTML = '';

  for(let r=0;r<15;r++){
    for(let c=0;c<15;c++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      const d = grid[r][c];

      switch(d.type){
        case 'GH': cell.classList.add('gh'); break;
        case 'GI': cell.classList.add('gh','inner'); break;
        case 'GT':
          cell.classList.add('gh','inner');
          cell.innerHTML='<div class="tok" style="background:#27ae60"></div>'; break;
        case 'RH': cell.classList.add('rh'); break;
        case 'RI': cell.classList.add('rh','inner'); break;
        case 'RT':
          cell.classList.add('rh','inner');
          cell.innerHTML='<div class="tok" style="background:#e74c3c"></div>'; break;
        case 'YH': cell.classList.add('yh'); break;
        case 'YI': cell.classList.add('yh','inner'); break;
        case 'YT':
          cell.classList.add('yh','inner');
          cell.innerHTML='<div class="tok" style="background:#d4ac0d"></div>'; break;
        case 'BH': cell.classList.add('bh'); break;
        case 'BI': cell.classList.add('bh','inner'); break;
        case 'BT':
          cell.classList.add('bh','inner');
          cell.innerHTML='<div class="tok" style="background:#2980b9"></div>'; break;
        case 'SG': cell.classList.add('sG'); break;
        case 'SGE': cell.classList.add('sGe'); break;
        case 'SR': cell.classList.add('sR'); break;
        case 'SRE': cell.classList.add('sRe'); break;
        case 'SY': cell.classList.add('sY'); break;
        case 'SYE': cell.classList.add('sYe'); break;
        case 'SB': cell.classList.add('sB'); break;
        case 'SBE': cell.classList.add('sBe'); break;
        case 'STAR':
          cell.classList.add('path','star-sq');
          cell.innerHTML='<span style="font-size:7px">⭐</span>'; break;
        case 'P':
          cell.classList.add('path'); break;
        case 'CTR':
          cell.classList.add('ctr');
          const cr=d.cr,cc=d.cc;
          if(cr===0&&cc===0) cell.style.background='linear-gradient(135deg,#27ae60 50%,#f0f0f0 50%)';
          else if(cr===0&&cc===2) cell.style.background='linear-gradient(225deg,#e74c3c 50%,#f0f0f0 50%)';
          else if(cr===2&&cc===0) cell.style.background='linear-gradient(45deg,#d4ac0d 50%,#f0f0f0 50%)';
          else if(cr===2&&cc===2) cell.style.background='linear-gradient(315deg,#2980b9 50%,#f0f0f0 50%)';
          else if(cr===1&&cc===1){
            cell.style.background='#fff';
            cell.innerHTML='<span style="font-size:5px;font-family:Cinzel,serif;font-weight:900;color:#555;letter-spacing:.2px">HOME</span>';
          }
          else cell.style.background='#e8e8e8';
          break;
        case 'MG': case 'MR': case 'MB': case 'MY': {
          const arm = {MG:'G',MR:'R',MB:'B',MY:'Y'}[d.type];
          const col = ARMS[arm];
          const done = MET.has(d.m.name);
          cell.classList.add('mbr');
          if(done) cell.classList.add('done');
          cell.style.background = done ? col.hex : col.hex;
          cell.innerHTML = '<span class="mn">' + d.m.name.split(' ').map(w=>w[0]||'').slice(0,2).join('') +
            '<br>' + d.m.name.split(' ')[0] + '</span>';
          if(!done) cell.onclick = () => openModal(d.m, arm);
          break;
        }
      }
      bd.appendChild(cell);
    }
  }
}

function updateStats() {
  let total=0, met=0;
  const byCnt={G:0,R:0,B:0,Y:0};
  Object.entries(ARMS).forEach(([k,a])=>{
    a.members.forEach(m=>{ total++; if(MET.has(m.name)){met++;byCnt[k]++;} });
  });
  const pct=total?Math.round(met/total*100):0;
  document.getElementById('prog-ct').textContent=met+' / '+total+' Met';
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('met-num').textContent=met+'/'+total;
  document.getElementById('prog-cats').innerHTML=Object.entries(ARMS).map(([k,a])=>{
    const cnt=byCnt[k];
    return '<div class="pcat"><div class="pdot" style="background:'+a.hex+'"></div>'+cnt+'/'+a.members.length+' '+a.label+'</div>';
  }).join('');
}

function openModal(m, arm) {
  SEL={m,arm}; PHOTO=null;
  const col=ARMS[arm];
  document.getElementById('sh').style.borderColor=col.hex;
  document.getElementById('bok').style.background=col.hex;
  document.getElementById('mt').textContent='Meet '+m.name;
  document.getElementById('ms').textContent=m.name+' · '+m.team;
  document.getElementById('pa').innerHTML='<div class="pi">📸</div><div class="pt">Tap to take selfie or upload photo</div>';
  document.getElementById('pa').classList.remove('hp');
  document.getElementById('bok').disabled=true;
  document.getElementById('ov').classList.add('open');
}
function closeModal(){document.getElementById('ov').classList.remove('open');SEL=null;PHOTO=null;}
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)closeModal();});
function handlePhoto(e){
  const f=e.target.files[0];if(!f)return;
  PHOTO=f;
  const url=URL.createObjectURL(f);
  document.getElementById('pa').innerHTML='<img src="'+url+'" alt="photo">';
  document.getElementById('pa').classList.add('hp');
  document.getElementById('bok').disabled=false;
}
function confirmMeet(){
  if(!SEL||!PHOTO)return;
  MET.add(SEL.m.name);
  closeModal();
  renderBoard();
  updateStats();
  showToast('Meeting logged! +1,000 pts ✨');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show';
  setTimeout(()=>{t.className='toast';},2800);
}

renderBoard();
updateStats();
</script>
</body>
</html>
